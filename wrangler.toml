name = "dba-worker-prod"
main = "src/index.js"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "devicebasedauth.org/*", zone_name = "devicebasedauth.org" },
  { pattern = "www.devicebasedauth.org/*", zone_name = "devicebasedauth.org" }
]

[assets]
directory = "./frontend"
binding = "ASSETS"
# Static pages, SDK and docs are served without invoking the Worker (and cost nothing).
run_worker_first = ["/api/*", "/status/*", "/.well-known/*", "/oauth/*", "/webhooks/*", "/mcp", "/health"]

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://devicebasedauth.org"
ISSUER = "https://devicebasedauth.org"
# The R2 bucket's public custom domain: status-list cache hits never reach the Worker.
STATUS_ORIGIN = "https://status.devicebasedauth.org"
APP_AUDIENCE = "devicebasedauth.org"
STATUS_SHARDS = "16"
WORKER_NAME = "dba-worker-prod"

# Secrets, pushed by .github/workflows/deploy.yml (see docs/ops/deployment.md):
# ISSUER_KEYS            JSON [{ "kid", "jwk" (private P-256), "retired"? }]; first non-retired signs
# TOKEN_SIGNING_KEY      HMAC key for API keys, enrollment tickets, poll tokens and OIDC codes
# CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY, CLERK_WEBHOOK_SECRET
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET (+ vars STRIPE_CREDIT_PRODUCT_ID, STRIPE_CARD_COST_PRODUCT_ID)
# OPERATOR_ACCOUNT       Clerk user id that owns the first-party audiences (and pays their decisions/logins)
# CLOUDFLARE_ANALYTICS_TOKEN, CLOUDFLARE_ACCOUNT_ID, COST_SAFETY_DO_NAMESPACES (cost-safety brake)
# PUSH_VAPID_KEY         private P-256 JWK signing security notices (Web Push); without it they are off
# Optional: ALERT_WEBHOOK_URL, COST_SAFETY_BRAKE_CENTS, COST_SAFETY_HARD_STOP=true, LAUNCH_APPROVED=true, GIT_SHA

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountDO"

[[durable_objects.bindings]]
name = "STATUS"
class_name = "StatusListDO"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RegistryDO"

[[durable_objects.bindings]]
name = "ENROLLMENTS"
class_name = "EnrollmentDO"

[[durable_objects.bindings]]
name = "SAFETY"
class_name = "SafetyDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountDO", "StatusListDO", "RegistryDO", "EnrollmentDO", "SafetyDO"]

[[r2_buckets]]
binding = "STATUS_BUCKET"
bucket_name = "dba-status-prod"

[triggers]
crons = ["7 * * * *"]

[[ratelimits]]
name = "PUBLIC_LIMITER"
namespace_id = "2001"
simple = { limit = 240, period = 60 }
