name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography==44.0.0 requests==2.32.3
      - run: python3 -m unittest discover -s packages/verify-python/tests -t packages/verify-python
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./... && test -z "$(gofmt -l .)" && go test -count=1 ./...
        working-directory: packages/verify-go
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools
      - run: npm run test:samples
        env:
          DBA_SAMPLES_STRICT: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --trace off
      - run: npx wrangler deploy --dry-run --outdir /tmp/dba-build
  ios-sample:
    # The iOS sample (Swift, CryptoKit, DeviceCheck) needs Apple's SDKs: build it, type-check it for
    # iOS, and run its client against a local server with a software key.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: swift --version
      - run: npm run test:samples
        env:
          DBA_SAMPLES_STRICT: '1'
          DBA_SAMPLES_ONLY: ios
