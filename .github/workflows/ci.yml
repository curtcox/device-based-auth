name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:file-sizes
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography==44.0.0 requests==2.32.3
      - run: python3 -m unittest discover -s packages/verify-python/tests -t packages/verify-python
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./... && test -z "$(gofmt -l .)" && go test -count=1 ./...
        working-directory: packages/verify-go
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools gnome-keyring libsecret-tools dbus-daemon dbus-bin
      # A private session bus with an unlocked GNOME Keyring, so os-keychain.sh stores the CLI's
      # key through the real Secret Service (secret-tool), as on a Linux desktop.
      - run: dbus-run-session -- bash -c 'printf ci-keyring | gnome-keyring-daemon --unlock --components=secrets >/dev/null && npm run test:samples'
        env:
          DBA_SAMPLES_STRICT: '1'
          DBA_SAMPLES_OS_KEYCHAIN: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --trace off
      - run: npx wrangler deploy --dry-run --outdir /tmp/dba-build
  ios-sample:
    # The iOS sample (Swift, CryptoKit, DeviceCheck) needs Apple's SDKs: build it, type-check it for
    # iOS, and run its client against a local server with a software key.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: swift --version
      # A throwaway default keychain, unlocked, for os-keychain.sh (the CLI's key in the Keychain).
      - run: |
          security create-keychain -p ci dba-ci.keychain
          security set-keychain-settings dba-ci.keychain
          security unlock-keychain -p ci dba-ci.keychain
          security list-keychains -d user -s dba-ci.keychain
          security default-keychain -d user -s dba-ci.keychain
      - run: npm run test:samples
        env:
          DBA_SAMPLES_STRICT: '1'
          DBA_SAMPLES_ONLY: ios,os-keychain.sh
          DBA_SAMPLES_OS_KEYCHAIN: '1'
